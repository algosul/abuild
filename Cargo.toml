[package]
name = "abuild"
version = "0.1.0"
edition = "2024"
publish = true

[lib]
name = "abuild"
crate-type = ["rlib"]

[[bin]]
name = "abuild-cli"

[[test]]
name = "example-0"

[dependencies]
log.workspace = true
env_logger.workspace = true

[workspace]
members = ["."]
resolver = "3"

[workspace.dependencies]
log = { version = "0.4.29" }
env_logger = "*"

[profile.dev]

[profile.release]
