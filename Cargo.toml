[package]
name = "abuild"
version = "0.0.1"
authors = ["algosul@github.com"]
homepage = "https://github.com/algosul/abuild"
repository = "https://github.com/algosul/abuild"
keywords = ["algosul", "build"]
license = "AGPL-3.0-only"
edition = "2024"
description = "Some user-friendly yet personalized tools"
build = "build.rs"

[lib]
name = "abuild"
crate-type = ["rlib"]

[[bin]]
name = "abuild"
path = "src/bin/main.rs"

[[test]]
name = "abuild-project"
path = "tests/project.rs"

[dependencies]
clap = { version = "*", features = ["cargo", "derive", "unicode", "string"] }
clap_complete = "*"
colored = "*"
algosul = { version = "0.0.5", features = ["app-apps"] }
thiserror = { version = "2.0.14" }

[dependencies.strum]
version = "0.27.2"
features = ["derive"]
